spring:
  application:
    name: SportsAdvisor
  ai:
    ollama:
      base-url: http://localhost:11434
      api-key: sk-8617d964572141eba7fd36b4c256a23c
      chat:
        model: qwen2.5:7b
      embedding:
        model: mxbai-embed-large   # 确保名称与 ollama list 中显示的一致
    #    vectorstore:
    #      redis:
    #        index-name: running-knowledge-index
    #        prefix: "running:knowledge:"
    #        initialize-schema: true
    retry:
      on-client-errors: true
      max-attempts: 3
    chat:
      client:
        observations:
          log-prompt: true      # 生产环境关闭，避免 PII 泄漏
          log-completion: false
      observations:
        log-prompt: true
        log-completion: false
        include-error-logging: true

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
  datasource:
    url: jdbc:mysql://localhost:3306/sports_advisor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: luyushuang
    password: 1231
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.luyushuang.sportsadvisor.persistence.handler
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 10

app:
  knowledge:
    version: "2026-10-15-v1"
    path: "knowledge"

logging:
  level:
    com.luyushuang.sportsadvisor.persistence.mapper: DEBUG
    # 将 Spring AI 聊天观测相关的日志级别设为 DEBUG
#    org.springframework.ai.chat.observation: DEBUG
    # 为了看到更全面的 Spring AI 交互日志，也可以直接设置父包级别
    org.springframework.ai: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: sports-advisor
